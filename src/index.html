<script type="module">
// La página se arma cuando ya se pintó el inicio (rueda y título): así aparece rápido también en celulares.
// Los botones de WhatsApp y el menú funcionan desde el primer momento porque son ligas normales.
let ya=false;
const go=()=>{ if(ya) return; ya=true; requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>import('./{{JS}}'),0))); };
